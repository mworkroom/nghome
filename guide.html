<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00b5ef" />
    <meta
      name="description"
      content="NANGOK 사용 안내 — 교육자료 만들기와 줌 화면 공유"
    />
    <title>사용 안내 | NANGOK</title>

    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <link rel="stylesheet" href="./style.css" />

    <style>
      .guide-task-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .guide-task-grid .app-card {
        grid-template-columns: 62px minmax(0, 1fr) 36px;
        gap: 16px;
        min-height: 190px;
        padding: 28px 22px;
      }

      .guide-task-grid .app-card__icon {
        width: 62px;
        height: 62px;
        border-radius: 15px;
      }

      .guide-task-grid .app-card__icon svg {
        width: 36px;
        height: 36px;
      }

      .guide-task-grid .app-card__content strong {
        font-size: 22px;
        line-height: 1.35;
      }

      .guide-task-grid .app-card__arrow {
        width: 36px;
        height: 36px;
      }

      @media (max-width: 1050px) {
        .guide-task-grid {
          grid-template-columns: 1fr;
        }

        .guide-task-grid .app-card {
          grid-template-columns: 74px minmax(0, 1fr) 42px;
          min-height: 156px;
          padding: 28px;
        }

        .guide-task-grid .app-card__icon {
          width: 74px;
          height: 74px;
        }

        .guide-task-grid .app-card__icon svg {
          width: 42px;
          height: 42px;
        }

        .guide-task-grid .app-card__arrow {
          width: 42px;
          height: 42px;
        }
      }

      @media (max-width: 560px) {
        .guide-task-grid .app-card {
          grid-template-columns: 58px minmax(0, 1fr) 34px;
          gap: 15px;
          min-height: 130px;
          padding: 23px 18px 23px 21px;
        }

        .guide-task-grid .app-card__icon {
          width: 58px;
          height: 58px;
          border-radius: 14px;
        }

        .guide-task-grid .app-card__icon svg {
          width: 34px;
          height: 34px;
        }

        .guide-task-grid .app-card__content strong {
          font-size: 20px;
        }

        .guide-task-grid .app-card__arrow {
          width: 34px;
          height: 34px;
        }
      }
    </style>
  </head>

  <body>
    <div class="page-shell">
      <div class="ambient ambient--top" aria-hidden="true"></div>
      <div class="ambient ambient--bottom" aria-hidden="true"></div>

      <header class="site-header">
        <a class="brand" href="./index.html" aria-label="NANGOK 홈으로 돌아가기">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="brand-text">
            <strong>NANGOK</strong>
            <small>WORKSPACE</small>
          </span>
        </a>

        <div class="tool-count" aria-label="사용 안내">
          <span class="tool-count__dot"></span>
          사용 안내
        </div>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <p class="eyebrow">WORK GUIDE</p>
          <h1 id="page-title">지금 하려는 일을 선택하세요</h1>
          <p class="hero-description">현재 상황에 맞는 메뉴를 누르면 바로 시작할 수 있습니다.</p>
        </section>

        <section class="app-grid guide-task-grid" aria-label="사용 안내 단계">
          <a
            class="app-card"
            href="./guides/ai.html"
            style="--accent: #527d88; --accent-soft: #eaf2f4"
          >
            <span class="app-card__icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" role="img">
                <rect x="8" y="7" width="32" height="34" rx="4"></rect>
                <path d="M15 16h18"></path>
                <path d="M15 23h18"></path>
                <path d="M15 30h10"></path>
                <path d="M31 34v8"></path>
                <path d="M27 38h8"></path>
              </svg>
            </span>
            <span class="app-card__content">
              <span class="app-card__category">1단계</span>
              <strong>새 교육자료를 처음부터 만들기</strong>
              <span class="app-card__description">챗지피티로 그림을 만드는 방법부터 시작</span>
            </span>
            <span class="app-card__arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg>
            </span>
          </a>

          <a
            class="app-card"
            href="https://present.nangok.app/"
            style="--accent: #168cb9; --accent-soft: #e8f4f8"
          >
            <span class="app-card__icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" role="img">
                <rect x="7" y="9" width="26" height="30" rx="4"></rect>
                <path d="M14 17h12"></path>
                <path d="M14 24h12"></path>
                <path d="M14 31h8"></path>
                <path d="M33 19h8v20H15"></path>
              </svg>
            </span>
            <span class="app-card__content">
              <span class="app-card__category">2단계</span>
              <strong>그림은 만들었고 PDF로 합치기</strong>
              <span class="app-card__description">만든 그림을 순서대로 정리하고 PDF로 저장</span>
            </span>
            <span class="app-card__arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg>
            </span>
          </a>

          <button
            class="app-card"
            style="--accent: #4d7ea8; --accent-soft: #eaf2f8"
            type="button"
            data-open-zoom-dialog
            aria-haspopup="dialog"
          >
            <span class="app-card__icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" role="img">
                <rect x="7" y="12" width="25" height="24" rx="5"></rect>
                <path d="m32 20 9-5v18l-9-5Z"></path>
                <path d="M14 21h11"></path>
                <path d="m21 17 4 4-4 4"></path>
              </svg>
            </span>
            <span class="app-card__content">
              <span class="app-card__category">3단계</span>
              <strong>Zoom에서 보여주기</strong>
              <span class="app-card__description">PDF 또는 PPTX 화면 공유 방법</span>
            </span>
            <span class="app-card__arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg>
            </span>
          </button>
        </section>
      </main>

      <dialog class="price-dialog" id="zoom-dialog" aria-labelledby="zoom-dialog-title">
        <div class="price-dialog__panel">
          <button class="price-dialog__close" type="button" data-close-zoom-dialog aria-label="닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>

          <div class="price-dialog__header">
            <span class="price-dialog__eyebrow">Zoom에서 보여주기</span>
            <h2 id="zoom-dialog-title">어떤 파일을 보여주실 건가요?</h2>
          </div>

          <div class="price-role-list">
            <a class="price-role price-role--primary" href="./guides/pdf.html">
              <span class="price-role__text">
                <strong>파일 이름 끝이 .pdf</strong>
                <small>사진 여러 장이 한 파일로 묶인 자료</small>
              </span>
              <span class="price-role__arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg>
              </span>
            </a>

            <a class="price-role price-role--primary" href="./guides/pptx.html">
              <span class="price-role__text">
                <strong>파일 이름 끝이 .pptx</strong>
                <small>다른 사람이 보낸 파워포인트 자료</small>
              </span>
              <span class="price-role__arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg>
              </span>
            </a>
          </div>
        </div>
      </dialog>

      <footer class="site-footer">
        <span class="footer-line"></span>
        <p>nangok.app</p>
      </footer>
    </div>

    <script>
      const zoomDialog = document.getElementById("zoom-dialog");
      const openZoomDialogButton = document.querySelector("[data-open-zoom-dialog]");
      const closeZoomDialogButton = document.querySelector("[data-close-zoom-dialog]");

      openZoomDialogButton.addEventListener("click", () => zoomDialog.showModal());
      closeZoomDialogButton.addEventListener("click", () => zoomDialog.close());

      zoomDialog.addEventListener("click", (event) => {
        if (event.target === zoomDialog) zoomDialog.close();
      });
    </script>
  </body>
</html>
